<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="icone">
            🔒
        </div>

        <h1>GERADOR DE SENHAS</h1>

        <div class="senha-gerada">
            <span>Senha:</span>
            <strong>A19b2xW</strong>
        </div>

        <section class="painel">

            <h2>Personalize sua senha</h2>

            <div class="conteudo">

                <!-- Esquerda -->
                <div class="configuracoes">

                    <p>Número de caracteres</p>

                    <div class="contador">
                        <button>-</button>
                        <span>7</span>
                        <button>+</button>
                    </div>

                    <div class="opcoes">
                        <label>
                            <input type="checkbox" checked>
                            Letras maiúsculas
                        </label>

                        <label>
                            <input type="checkbox" checked>
                            Letras minúsculas
                        </label>

                        <label>
                            <input type="checkbox">
                            Números
                        </label>

                        <label>
                            <input type="checkbox">
                            Símbolos
                        </label>
                    </div>

                </div>

                <!-- Direita -->
                <div class="seguranca">

                    <p>Segurança da senha</p>

                    <div class="barra">
                        <span class="ativo"></span>
                        <span class="ativo"></span>
                        <span class="ativo"></span>
                    </div>

                    <div class="nivel">
                        <span>Fraca</span>
                        <span>Média</span>
                        <span>Forte</span>
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
